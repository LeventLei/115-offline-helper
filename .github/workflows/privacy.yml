name: Privacy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 检查真实作者提交；GitHub 的临时合并对象使用平台生成的身份。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: 检查提交历史中的隐私信息
        run: python3 scripts/check-privacy.py --history
      - name: 检查当前文件中的隐私信息
        run: git ls-files -z | xargs -0 -I{} sh -c 'python3 scripts/check-privacy.py --stdin < "$1"' sh '{}'
      - name: Gitleaks 凭据扫描（隐藏敏感值）
        shell: bash
        run: |
          scan_dir=$(mktemp -d)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$scan_dir/checksums.txt"
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' "$scan_dir/checksums.txt")
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$scan_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir"
          "$scan_dir/gitleaks" git . --log-opts=--all --redact=100 --no-banner
      - name: 功能测试和语法检查
        run: |
          npm ci --ignore-scripts --no-audit
          npm test
          npm run lint
